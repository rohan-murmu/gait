name: release

on:
  push:
    tags: ["v*"]

jobs:
  formula-sha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The tap formula needs the sha256 of the release tarball; print it for the tap PR.
      - name: Compute tarball sha256
        run: |
          TAG="${GITHUB_REF_NAME}"
          URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          echo "url    $URL"
          echo "sha256 $(curl -sL "$URL" | shasum -a 256 | cut -d' ' -f1)"
